apiVersion: apps/v1
kind: Deployment
metadata:
  name: nutri-backend
  labels:
    app: nutri-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nutri-backend
  template:
    metadata:
      labels:
        app: nutri-backend
    spec:
      containers:
      - name: nutri-backend
        image: nutriflow-backend:1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        env:
        - name: MONGO_URI
          value: "mongodb://nutri-mongo:27017/nutriflow"
        resources:
          limits:
            memory: "256Mi"
            cpu: "500m"
          requests:
            memory: "128Mi"
            cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: nutri-backend-service
spec:
  type: NodePort
  selector:
    app: nutri-backend
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080