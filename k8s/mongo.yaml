apiVersion: apps/v1
kind: Deployment
metadata:
  name: nutri-mongo
  labels:
    app: nutri-mongo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nutri-mongo
  template:
    metadata:
      labels:
        app: nutri-mongo
    spec:
      containers:
      - name: mongo
        image: mongo:7
        ports:
        - containerPort: 27017
---
apiVersion: v1
kind: Service
metadata:
  name: nutri-mongo
spec:
  selector:
    app: nutri-mongo
  ports:
    - protocol: TCP
      port: 27017
      targetPort: 27017